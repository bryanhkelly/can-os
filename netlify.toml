[build]
command = "vite build"
publish = "dist/client"

# WS00 development-only main consolidation safeguard.
# Netlify interprets ignore command exit 0 as SKIP build.
# Remove this block only after exact-SHA CI, DB authorization and pilot
# acceptance pass, and an explicitly approved production promotion.
# This only governs Netlify's Git-triggered production builds.
# It does NOT disable Netlify build hooks/manual deploys or Cloudflare.
[context.production]
  ignore = "exit 0"

[dev]
command = "npm run dev"
port = 3000

# Baseline security headers. script-src/style-src allow 'unsafe-inline' because
# TanStack Start injects inline hydration scripts and Tailwind emits inline styles.
[[headers]]
for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.r2.cloudflarestorage.com; media-src 'self' https:; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
