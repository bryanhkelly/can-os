name: Cloudflare production build and regression gate

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: can-os-cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Exact Cloudflare bundle, typecheck and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Show the exact source revision and toolchain
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Reproducible clean dependency install
        run: npm ci
      - name: Engineering architecture and V6.1 source governance
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -o pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            export V61_BASE_REF="$PR_BASE_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/release-* ]]; then
            export V61_BASE_REF="$(git merge-base HEAD origin/main)"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            export V61_BASE_REF="$PUSH_BEFORE_SHA"
          else
            export V61_BASE_REF="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$V61_BASE_REF^{commit}"
          npm run verify:architecture 2>&1 | tee architecture-governance.log
      - name: Identity-release regression gates
        run: |
          npx vitest run tests/unit/one-person-release-gate.test.ts tests/unit/access-context.test.ts tests/unit/personal-can-identity.test.ts tests/unit/canonical-can-sso.test.ts
      - name: Cloudflare production bundle (client AND server)
        shell: bash
        run: |
          set -o pipefail
          npm run build:cloudflare 2>&1 | tee cloudflare-build.log
      - name: TypeScript diagnostics after route generation
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Site enrollment and website regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:site:channels 2>&1 | tee site-regressions.log
      - name: Go Links and friendly URLs regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:urls:unit 2>&1 | tee go-links-regressions.log
      - name: Native Class regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:classes:unit 2>&1 | tee class-regressions.log
      - name: Retain diagnostics for first failure at this exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-release-gate-${{ github.sha }}
          path: |
            architecture-governance.log
            cloudflare-build.log
            typecheck.log
            site-regressions.log
            class-regressions.log
            go-links-regressions.log
          if-no-files-found: warn
          retention-days: 14
