name: Migration Preview

on:
  push:
    branches:
      - "db/**"

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install schema tooling
        run: npm install --no-save --package-lock=false drizzle-kit@0.31.11 drizzle-orm@0.45.4 typescript@5.8.3 tsx@4.20.0

      - name: Generate migration SQL
        run: |
          rm -rf drizzle
          npx drizzle-kit generate
          echo "=== CAN_OS_GENERATED_MIGRATION ==="
          cat drizzle/*.sql
          echo "=== END_CAN_OS_GENERATED_MIGRATION ==="
