name: Migration Preview

on:
  push:
    branches:
      - "school-operations-foundation"

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install migration tooling only
        run: |
          mkdir -p /tmp/can-migration-tools
          cd /tmp/can-migration-tools
          npm init -y
          npm install drizzle-kit@0.31.11 drizzle-orm@0.45.4 typescript@5.8.3 tsx@4.20.0
          ln -s /tmp/can-migration-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Generate incremental migration SQL
        run: /tmp/can-migration-tools/node_modules/.bin/drizzle-kit generate

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Generate whole-school operations migration"
            git push
          fi
