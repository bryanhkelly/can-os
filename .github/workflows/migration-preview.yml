name: Migration Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install schema tooling
        run: npm install --no-save --package-lock=false drizzle-kit@0.31.11 drizzle-orm@0.45.4 typescript@5.8.3 tsx@4.20.0

      - name: Generate migration SQL
        run: |
          rm -rf drizzle
          npx drizzle-kit generate

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Generate Drizzle migration"
            git push
          fi
