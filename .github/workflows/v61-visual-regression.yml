name: V6.1 visual regression acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main, 'release-*', '6.1-storybook-configuration']
permissions:
  contents: read
jobs:
  source-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - run: npm run test:design-audit
      - run: node --test scripts/lib/v61-visual-evidence.test.mjs
      - name: Verify V6.1 source against the full release range
        run: |
          git fetch origin main
          export V61_BASE_REF="$(git merge-base HEAD origin/main)"
          node scripts/check-design-system.mjs
      - run: npm run check:component-boundaries
      - name: Require source coverage and reviewed independent render evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p acceptance-artifacts
          npm run --silent design:inventory > acceptance-artifacts/v61-adoption.json
          npm run --silent architecture:inventory > acceptance-artifacts/v61-architecture.json
          node scripts/check-v61-coverage.mjs --strict | tee acceptance-artifacts/v61-coverage.json
      - name: Preserve source coverage diagnostics even when acceptance fails
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: v61-source-coverage-${{ github.run_attempt }}
          path: |
            acceptance-artifacts/v61-coverage.json
            acceptance-artifacts/v61-adoption.json
            acceptance-artifacts/v61-architecture.json
          if-no-files-found: error
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:full
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run storybook:doctor
      - run: npx playwright install --with-deps chromium
      - run: npm run check:storybook:fonts
      - run: npm run check:storybook:visual-config
      - run: npm run test:storybook:contracts
      - run: npm run test:storybook
      - run: npm run build-storybook
      - run: npm run storybook:inventory
      - run: npm run test:storybook:browser
      - name: Preserve Storybook browser and index diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: v61-storybook-acceptance-${{ github.run_attempt }}
          path: |
            acceptance-artifacts/storybook-index.json
            acceptance-artifacts/storybook-browser-report/
            acceptance-artifacts/storybook-browser-results/
          if-no-files-found: warn
      - name: Compare rendered stories against reviewed Chromatic baselines
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::Chromatic project token missing; visual acceptance blocked"
            exit 1
          fi
          npx --no-install chromatic --storybook-build-dir=storybook-static --exit-zero-on-changes=false --auto-accept-changes=false
