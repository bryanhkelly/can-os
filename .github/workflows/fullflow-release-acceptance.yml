name: FullFlow Connected Release Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# A single isolated FullFlow Neon branch must not receive parallel fixtures,
# migrations or authenticated browser sessions.
concurrency:
  group: fullflow-connected-release-acceptance
  cancel-in-progress: false

jobs:
  connected:
    name: One school, end-to-end isolated Neon acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: integration-test
    env:
      APP_ENV: test
      NODE_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: "true"
      CAN_DEMO_WRITES_ENABLED: "true"
      TEST_DATABASE_URL: ${{ secrets.CAN_FULLFLOW_TEST_DATABASE_URL }}
      CAN_ADMISSIONS_TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
      CAN_ADMISSIONS_TEST_BRANCH_ID: ${{ vars.CAN_ADMISSIONS_TEST_BRANCH_ID }}
      DATABASE_URL: ${{ secrets.CAN_FULLFLOW_TEST_DATABASE_URL }}
      CAN_APPLICATION_DB_HOST: ${{ vars.CAN_APPLICATION_DB_HOST }}
    steps:
      - name: Checkout selected FullFlow ref
        uses: actions/checkout@v4
      - name: Require approved test branch and credentials
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "FullFlow" ]]; then
            echo "::error::FullFlow release acceptance only runs on the reviewed FullFlow branch."
            exit 1
          fi
          if [[ -z "${TEST_DATABASE_URL}" || -z "${CAN_APPLICATION_DB_HOST}" || -z "${CAN_ADMISSIONS_TEST_DATABASE_URL}" || -z "${CAN_ADMISSIONS_TEST_BRANCH_ID}" ]]; then
            echo "::error::HOLD: configure approved FullFlow and admissions disposable Neon secrets, branch IDs, and application endpoint guard in integration-test."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit route fixture coverage
        run: node scripts/check-route-fixture-coverage.mjs
      - name: Verify static code and committed migration consistency
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm test
          npx drizzle-kit check
          if [[ -n "$(git status --porcelain -- drizzle/)" ]]; then
            echo "::error::HOLD: schema verification unexpectedly modified committed migration artifacts."
            exit 1
          fi
      - name: Verify isolated endpoint and Postgres-attested FullFlow branch
        run: |
          npm run test:integration:full-flow -- --preflight
          npm run db:migrate:fullflow -- --preflight
      - name: Ensure independent admissions target differs from FullFlow target
        shell: bash
        run: |
          node --input-type=module -e '
            const a = new URL(process.env.TEST_DATABASE_URL);
            const b = new URL(process.env.CAN_ADMISSIONS_TEST_DATABASE_URL);
            const stripPool = host => host.replace(/-pooler(?=\.)/, "").toLowerCase();
            if (stripPool(a.hostname) === stripPool(b.hostname) && a.pathname === b.pathname) {
              console.error("HOLD: admissions and FullFlow acceptance must not migrate the same isolated database twice.");
              process.exit(1);
            }
          '
      - name: Verify separate admissions database is an attested disposable branch
        env:
          TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: |
          npm run test:integration:admissions -- --preflight
          node scripts/verify-admissions-neon-branch.mjs
      - name: Require distinct Postgres-attested Neon branch IDs before any writes
        shell: bash
        run: |
          if [[ "${CAN_ADMISSIONS_TEST_BRANCH_ID}" == "br-proud-pine-arfju8h2" ]]; then
            echo "::error::HOLD: admissions branch is the pinned FullFlow branch; independent migration is unsafe."
            exit 1
          fi
      - name: Apply only reviewed migrations to isolated FullFlow branch
        run: npm run db:migrate:fullflow
      - name: Apply admissions migrations on separately guarded disposable branch
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Run connected admissions integration
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npm run test:integration:admissions
      - name: Verify complete cross-role school transaction
        run: npm run test:integration:full-flow
      - name: Verify independently supervised church school day
        run: npm run test:integration:journey-c
      - name: Install browser for real authenticated sessions
        run: npx playwright install --with-deps chromium
      - name: Run authenticated admissions browser acceptance
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npm run test:e2e:admissions
      - name: Verify connected launch, admission, instruction, guardian, and operations browser journey
        run: npm run test:e2e:full-flow
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullflow-connected-acceptance-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record evidence limitations
        if: always()
        shell: bash
        run: |
          {
            echo "## FullFlow connected release acceptance"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Every step above (including separate-branch admissions and safeguarding) must succeed on this exact SHA. Any failure or skip means HOLD."
            echo "- Status: CONNECTED-GATES PASS only when every check succeeds; operational deployment readiness and coordinator approval remain separate."
            echo "- This run provides same-SHA admissions, static, schema and Journey C results only when all respective steps pass. Deployment readiness and coordinator approval are separate."
            echo "- This synthetic isolated-branch evidence does not authorize production deployment or certify legal/accreditation compliance."
          } >> "${GITHUB_STEP_SUMMARY}"
