name: GF1 Neon Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# Admissions and GF1 share the same configured test DB: never migrate or
# mutate it from both workflows at the same time.
concurrency:
  group: admissions-neon-acceptance
  cancel-in-progress: false

jobs:
  academic-intervention:
    name: Disposable Neon GF1 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: integration-test
    env:
      APP_ENV: test
      NODE_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: "true"
      TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
      CAN_APPLICATION_DB_HOST: ${{ vars.CAN_APPLICATION_DB_HOST }}
      CAN_ADMISSIONS_TEST_BRANCH_ID: ${{ vars.CAN_ADMISSIONS_TEST_BRANCH_ID }}
      CAN_DEMO_WRITES_ENABLED: "true"
      CAN_ACCESS_TOKEN_PEPPER: "gf1-e2e-access-pepper-0123456789abcdef0"
      CAN_JOB_SECRET: "gf1-e2e-job-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require isolated test database secret
        shell: bash
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Configure CAN_ADMISSIONS_TEST_DATABASE_URL on the integration-test environment, pointing to a disposable Neon branch."
            exit 1
          fi
          if [ -z "$CAN_APPLICATION_DB_HOST" ]; then
            echo "::error::Configure CAN_APPLICATION_DB_HOST as a nonsecret environment variable identifying the production database host."
            exit 1
          fi
          if [ -z "$CAN_ADMISSIONS_TEST_BRANCH_ID" ]; then
            echo "::error::Configure CAN_ADMISSIONS_TEST_BRANCH_ID in the integration-test environment with the approved nonproduction Neon branch ID."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify disposable database endpoint before any writes
        run: npm run test:integration:academic-intervention -- --preflight
      - name: Verify actual nonproduction Neon branch before writes
        run: node scripts/verify-admissions-neon-branch.mjs
      - name: Apply committed schema migrations to disposable Neon branch
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Run GF1 integration acceptance
        run: npm run test:integration:academic-intervention
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run GF1 cross-role browser flow
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npx playwright test tests/e2e/missing-assignment.spec.ts
      - name: Publish GF1 acceptance result
        if: always()
        shell: bash
        run: |
          {
            echo "## GF1 Neon acceptance"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Covers isolated Neon integration plus student, guardian, teacher, and specialist browser roles."
            echo "- A completed workflow is **not** release approval unless every required step succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
