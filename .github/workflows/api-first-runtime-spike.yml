name: API-first runtime spike (not a release gate)
on:
  push:
    branches: [architecture/api-first-nestjs]
    paths: ['apps/api/**', 'src/**', 'scripts/architecture/**', 'scripts/acceptance/**', 'playwright.nest-student-api.config.ts', 'tests/e2e/**', 'package*.json', '.github/workflows/api-first-runtime-spike.yml', 'docs/architecture/api-first-engineering-standard.md']
  pull_request:
    branches: [architecture/api-first-nestjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve initial lock (temporary, spike only)
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
      - uses: actions/upload-artifact@v4
        with:
          name: api-dependency-lock
          path: apps/api/package-lock.json
          if-no-files-found: error
      - run: npm ci
      - name: Install existing locked root dependencies
        working-directory: .
        run: npm ci
      - name: Verify shared source syntax and local imports
        working-directory: .
        run: |
          npm run check:build-source-syntax
          npm run check:local-import-exports
      - name: Verify HTTP wiring and operation uniqueness
        working-directory: .
        run: |
          set -o pipefail
          node scripts/architecture/check-http-api-wiring.mjs | tee apps/api/wiring-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-wiring-report
          path: apps/api/wiring-report.json
          if-no-files-found: warn
      - name: Inventory existing server functions
        working-directory: .
        run: node scripts/architecture/inventory-business-api.mjs > apps/api/rpc-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rpc-inventory
          path: apps/api/rpc-inventory.json
      - name: Build canonical bridge and reject frontend dependencies
        run: npm run build:canonical
      - run: npm test
      - name: Generate typed SDK from the executable OpenAPI document
        run: npm run sdk:generate && npm run sdk:check
      - run: npm run sdk:test && npm run sdk:verify
      - uses: actions/upload-artifact@v4
        with:
          name: api-contract-and-sdk-types
          path: apps/api/sdk/generated/
          if-no-files-found: error
      - run: npm audit --omit=dev --audit-level=high
      - name: Build and smoke locked transport image
        working-directory: .
        run: |
          if ! git ls-files --error-unmatch apps/api/package-lock.json >/dev/null 2>&1; then
            echo '::warning::No committed API lock; container packaging remains blocked.'
            exit 0
          fi
          docker build -f apps/api/Dockerfile -t becomuna-api:ws01 .
          node apps/api/scripts/smoke-container.mjs becomuna-api:ws01
