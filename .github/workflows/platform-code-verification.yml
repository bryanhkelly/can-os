name: CAN OS V6.1 Source and Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, build, unit and design system
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate reporting SQL migrations
        run: npm run verify:reporting:sql
      - name: Test reporting contracts and reusable architecture
        run: npm run test:reporting:foundation
      - name: Parse all runtime and build source before bundling
        run: npm run check:build-source-syntax
      - name: Reject missing named exports from local project modules
        run: npm run check:local-import-exports
      - name: Test local import/export guard behavior
        run: npm run test:local-import-exports
      - name: Generate TanStack route types and build application
        run: npm run build
      - name: Verify the production Cloudflare build target
        run: npm run build:cloudflare
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: V6.1 complete source coverage
        run: npm run design:coverage
      - name: V6.1 strict route and composed-component compliance
        run: npm run design:routes -- --strict
      - name: V6.1 source AST regression tests
        run: npm run test:design-audit
      - name: Design-system lint and coverage
        run: npm run lint
      - name: Record verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## CAN OS V6.1 code verification"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Connected Site/Program acceptance remains separate and requires isolated Neon credentials."
            echo "- No production authorization or compliance certification is implied."
          } >> "${GITHUB_STEP_SUMMARY}"

  storybook-v61:
    name: V6.1 browser behavior and responsive component evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Storybook with V6.1 tokens
        run: npm run build-storybook
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture V6.1 navigation and reporting at mobile/tablet/desktop
        run: node scripts/capture-v61-navigation-reporting.mjs
      - name: Exercise Storybook behavior and accessibility
        run: npm run test:storybook
      - name: Retain authentic browser evidence even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v61-navigation-reporting-browser-${{ github.run_id }}
          path: |
            artifacts/v61-navigation-reporting/
            test-results/
          if-no-files-found: warn
          retention-days: 21
