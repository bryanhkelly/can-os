name: GF26 migration synchronization
on:
  push:
    branches: [feature/gf26-study-groups]
    paths:
      - 'src/db/schema/**'
      - 'drizzle/**'
      - '.github/workflows/gf26-migration-sync.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'bryanhkelly/can-os'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Commit generated migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          if ! git diff --staged --quiet; then
            git commit -m "chore(gf26): synchronize Drizzle migration snapshots"
            git push origin HEAD:feature/gf26-study-groups
          fi
