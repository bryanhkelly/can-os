name: Curriculum Journey Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-to-student:
    name: Publisher to student (isolated Neon)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: curriculum-journey-acceptance
      cancel-in-progress: false
    env:
      TEST_DATABASE_URL: ${{ secrets.CURRICULUM_TEST_DATABASE_URL }}
      CAN_APPLICATION_DB_HOST: ${{ vars.CAN_APPLICATION_DB_HOST }}
      CAN_CURRICULUM_TEST_BRANCH_ID: ${{ vars.CAN_CURRICULUM_TEST_BRANCH_ID }}
      CAN_TEST_DB_WRITES_ENABLED: "true"
      NODE_ENV: test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Require disposable branch and known production host
        shell: bash
        run: |
          if [[ -z "${TEST_DATABASE_URL}" || -z "${CAN_APPLICATION_DB_HOST}" ]]; then
            echo "Acceptance NOT RUN: configure CURRICULUM_TEST_DATABASE_URL secret and CAN_APPLICATION_DB_HOST repository variable."
            exit 1
          fi
      - run: npm ci
      - name: Refuse production or shared database endpoints
        run: node scripts/run-integration-tests.mjs curriculum-journey --preflight
      - name: Execute real marketplace-to-classroom transaction
        run: npm run test:integration:curriculum-journey
      - name: Install isolated browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise school adoption, teacher and student through authenticated browser
        env:
          # Only the browser config expects DATABASE_URL==TEST_DATABASE_URL.
          # The integration preflight above intentionally refuses that equality.
          DATABASE_URL: ${{ secrets.CURRICULUM_TEST_DATABASE_URL }}
        run: npm run test:e2e:curriculum
      - name: Capture browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-journey-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
