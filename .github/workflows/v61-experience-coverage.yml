name: V6.1 experience registry
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release-*', '6.1-storybook-configuration']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/lib/v61-experience-registry.test.mjs
      - run: node scripts/check-v61-experience-coverage.mjs
