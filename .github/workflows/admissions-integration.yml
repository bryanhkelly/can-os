name: Admissions Neon Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admissions-neon-acceptance
  cancel-in-progress: false

jobs:
  admissions:
    name: Disposable Neon admissions acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: integration-test
    env:
      APP_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: "true"
      TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
      CAN_APPLICATION_DB_HOST: ${{ vars.CAN_APPLICATION_DB_HOST }}
      CAN_DEMO_WRITES_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require isolated test database secret
        shell: bash
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Configure CAN_ADMISSIONS_TEST_DATABASE_URL on the integration-test environment, pointing to a disposable Neon branch."
            exit 1
          fi
          if [ -z "$CAN_APPLICATION_DB_HOST" ]; then
            echo "::error::Configure CAN_APPLICATION_DB_HOST as a nonsecret environment variable identifying the production database host."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify disposable database endpoint before any writes
        run: npm run test:integration:admissions -- --preflight
      - name: Apply committed schema migrations to disposable Neon branch
        env:
          DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Run isolated admissions acceptance
        run: npm run test:integration:admissions
      - name: Publish release acceptance result
        if: always()
        shell: bash
        run: |
          {
            echo "## Admissions Neon acceptance"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Disposable database preflight, schema migration and integration test status are recorded in the job steps above."
            echo "- A completed workflow is **not** release approval; inspect every step for failures or skips."
          } >> "$GITHUB_STEP_SUMMARY"
