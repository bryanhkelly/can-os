name: Admissions Neon Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admissions-neon-acceptance
  cancel-in-progress: false

jobs:
  admissions:
    name: Disposable Neon admissions acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: integration-test
    env:
      APP_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: "true"
      TEST_DATABASE_URL: ${{ secrets.CAN_ADMISSIONS_TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CAN_APPLICATION_DATABASE_URL }}
      CAN_DEMO_WRITES_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require isolated test database secret
        shell: bash
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Configure CAN_ADMISSIONS_TEST_DATABASE_URL on the integration-test environment, pointing to a disposable Neon branch."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure CAN_APPLICATION_DATABASE_URL to allow the guarded runner to reject the application endpoint."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run isolated admissions acceptance
        run: npm run test:integration:admissions
