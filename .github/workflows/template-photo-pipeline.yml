name: Template photo pipeline — R2 cleanup and seven-template readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/platform/photography/**"
      - "src/domain/template-photography-production.ts"
      - "src/domain/template-photo-responsive.ts"
      - "src/platform/photography/r2-photo-reset.server.ts"
      - "src/domain/public-site-html.ts"
      - "src/routes/template-photo*"
      - "src/cloudflare-demo.ts"
      - "src/server.ts"
      - "vite.cloudflare.config.ts"
      - "wrangler.jsonc"
      - "tests/unit/template-photo-cron.test.ts"
      - "tests/unit/template-photo-responsive.test.ts"
      - "tests/unit/template-photo-reset.test.ts"
      - "tests/unit/template-photo-preview-roles.test.ts"
      - "scripts/check-template-photo-library.mjs"
      - ".github/workflows/template-photo-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: template-photo-pipeline
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify fal.ai to R2 mock end-to-end (no API charges)
        run: npx vitest run tests/unit/template-photo-cron.test.ts tests/unit/template-photography-worker.test.ts tests/unit/photo-binary.test.ts tests/unit/template-photo-responsive.test.ts tests/unit/template-photo-preview-roles.test.ts tests/unit/template-photo-reset.test.ts
      - name: Typecheck photography integration
        run: npm run typecheck
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

  verify-live:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed R2 archive/reset completion (read only)
        shell: bash
        run: |
          set -euo pipefail
          url="https://can-os.bryanhkelly.workers.dev/template-photo-status?template=community"
          for attempt in $(seq 1 24); do
            echo "Checking reset phase: attempt $attempt of 24"
            response=$(curl -fsS --retry 1 --max-time 20 "$url" || true)
            if [ -n "$response" ]; then
              echo "$response" | node -e '
                let json=""; process.stdin.on("data",d=>json+=d);
                process.stdin.on("end",()=>{
                  try {
                    const s=JSON.parse(json);
                    console.log(JSON.stringify({
                      phase:s.photoReset?.phase,
                      copied:s.photoReset?.copied,
                      removed:s.photoReset?.removed,
                      error:s.photoReset?.reason,
                      active:s.generated,
                      newSubmissionsEnabled:s.newSubmissionsEnabled,
                    }));
                  }catch {console.log("Response not valid JSON");}
                });
              '
              if PHOTO_RESET_STATUS="$response" node -e '
                try {
                  const s=JSON.parse(process.env.PHOTO_RESET_STATUS);
                  if(s.photoReset?.phase==="blocked"){
                    console.error("R2 reset is blocked: "+(s.photoReset.reason??"inspect logs"));
                    process.exit(2);
                  }
                  if(s.photoReset?.phase==="completed" &&
                     s.photoReset.copied===s.photoReset.removed &&
                     s.newSubmissionsEnabled===false)process.exit(0);
                }catch{}
                process.exit(1);
              '; then
                echo "Reset completed. Auditing all seven template inventories."
                node scripts/check-template-photo-library.mjs --require-reset
                echo "All seven templates verified clean. No paid generation requested."
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Photo reset not verified complete; see Cloudflare scheduled Worker logs"
          exit 1
