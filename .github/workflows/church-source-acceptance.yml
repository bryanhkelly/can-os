name: Church source discovery acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/domain/church-source-references*"
      - "src/domain/church-brand-suggestions*"
      - "src/domain/church-source-editorial-safety*"
      - "src/domain/church-web-fetch-diagnostics*"
      - "src/modules/sites/church-*"
      - "src/modules/sites/site-local-content.server.ts"
      - "src/components/operations/ChurchSource*"
      - "tests/integration/church-source-review.integration.test.ts"
      - ".github/workflows/church-source-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/domain/church-source-references*"
      - "src/modules/sites/church-*"
      - "src/components/operations/ChurchSource*"
      - "src/routes/site-website.tsx"
      - "src/db/schema/church-*"
      - "drizzle/0067_church_source_references.sql"
      - "drizzle/0068_church_content_suggestions.sql"
      - "drizzle/meta/0067_snapshot.json"
      - "drizzle/meta/0068_snapshot.json"
      - ".github/workflows/church-source-acceptance.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show exact tested head
        run: |
          echo "Church source tested commit: $(git rev-parse HEAD)"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate TanStack route types and verify compilation
        run: npm run build
      - name: Source safety and URL unit tests
        run: npx vitest run src/domain/church-source-references.test.ts src/domain/church-brand-suggestions.test.ts src/domain/church-source-editorial-safety.test.ts src/domain/church-web-fetch-diagnostics.test.ts src/modules/sites/church-public-web-fetch.server.test.ts tests/unit/site-local-content-command.test.ts
      - name: Migration chain check
        run: npx drizzle-kit check
      - name: Detect uncommitted migration delta
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
      - name: FullFlow migration artifact integrity (no Neon connection)
        run: node --test scripts/fullflow-post0051-artifacts.check.mjs
      # npm run db:review:fullflow is intentionally NOT run on PR runners.
      # It requires CAN_TEST_DB_WRITES_ENABLED=true and an isolated, verified
      # TEST_DATABASE_URL. Integration I owns that separately gated DB review.
      - name: Lint and design system checks
        run: npm run lint
      - name: Typecheck (whole-repository gate)
        run: npm run typecheck
