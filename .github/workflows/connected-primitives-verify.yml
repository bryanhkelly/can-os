name: Connected Primitives Verification

on:
  push:
    branches:
      - connect-core-primitives

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-route-fixture-coverage.mjs
      - run: npm run build
      - name: Generate Drizzle baseline
        run: |
          npm run db:generate
          generated="$(ls drizzle/0019_*.sql 2>/dev/null | head -n1 || true)"
          if [ -n "$generated" ]; then
            cat > "$generated" <<'EOF'
          -- Schema snapshot baseline only.
          -- DDL for educational capacity and connected section planning was committed in
          -- migrations 0017 and 0018. This no-op migration advances Drizzle's snapshot
          -- history so future generation does not try to recreate those existing tables.
          EOF
          fi
      - name: Commit generated Drizzle snapshot baseline
        run: |
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drizzle/
            git commit -m "db: baseline Drizzle snapshots after connected primitives"
            git push origin HEAD:connect-core-primitives
          fi
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-primitives-drizzle
          path: drizzle/
          retention-days: 1
