name: Generate Curriculum Unit Migration (temporary)

on:
  push:
    branches:
      - feature/algebra1-week02-unit-foundation
    paths:
      - ".github/workflows/generate-curriculum-unit-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/feature/algebra1-week02-unit-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/algebra1-week02-unit-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate canonical Drizzle migration and snapshot
        run: npm run db:generate
      - name: Commit generated migration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): generate canonical curriculum unit release migration"
            git push origin HEAD:feature/algebra1-week02-unit-foundation
          fi
