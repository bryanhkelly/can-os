name: Canonical v3.0.1 Database Acceptance

# The baseline is an independently installed PostgreSQL schema, not a Drizzle
# migration. Validate the committed DDL without touching Neon or application DBs.
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/canonical/v3.0.1/**'
      - 'scripts/check-canonical-v301-ddl.mjs'
      - 'scripts/check-canonical-v301-blueprint-flow.mjs'
      - 'scripts/seed-canonical-v301-demo.mjs'
      - 'scripts/isolated-test-db-guard.mjs'
      - '.github/workflows/canonical-v301-database.yml'
  push:
    branches:
      - main
      - 'integration/canonical-v301-pr279-281'
    paths:
      - 'database/canonical/v3.0.1/**'
      - 'scripts/check-canonical-v301-ddl.mjs'
      - 'scripts/check-canonical-v301-blueprint-flow.mjs'
      - 'scripts/seed-canonical-v301-demo.mjs'
      - 'scripts/isolated-test-db-guard.mjs'
      - '.github/workflows/canonical-v301-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-v301-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-rollback:
    name: PostgreSQL 18 canonical rollback and role-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: can_v301_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: can_v301_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d can_v301_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      NODE_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: 'true'
      TEST_DATABASE_URL: postgresql://postgres:can_v301_ci_disposable@127.0.0.1:5432/can_v301_ci
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate canonical DDL, access isolation and transaction rollback
        run: npm run db:canonical:v301:rollback-check
      - name: Install PostgreSQL command-line client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Install schema on disposable service and provision real roles
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/canonical/v3.0.1/schema.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE can_v30_ci_app LOGIN NOINHERIT NOBYPASSRLS PASSWORD 'ci_v301_disposable_only';
          CREATE ROLE can_v30_public_site_reader NOLOGIN NOINHERIT NOBYPASSRLS;
          CREATE ROLE can_v30_program_catalog_11111111111141118111111111111111 LOGIN NOINHERIT NOBYPASSRLS;
          INSERT INTO education_v30.organizations (id, legal_name, display_name)
            VALUES ('11111111-1111-4111-8111-111111111111', 'CI Organization', 'CI Organization');
          INSERT INTO education_v30.organizations (id, legal_name, display_name)
            VALUES ('22222222-2222-4222-8222-222222222222', 'Other Organization', 'Other Organization');
          INSERT INTO education_v30.geographic_areas (id,code,name,level_code)
            VALUES ('33333333-3333-4333-8333-333333333333','CI-US','CI geography','country');
          INSERT INTO education_v30.sites (id,code,name,site_kind,geographic_area_id)
            VALUES ('44444444-4444-4444-8444-444444444444','ci-authorized','Authorized Site','physical','33333333-3333-4333-8333-333333333333'),
                   ('55555555-5555-4555-8555-555555555555','ci-cross-org','Other Site','physical','33333333-3333-4333-8333-333333333333');
          INSERT INTO education_v30.site_organization_roles (site_id,organization_id,role_code,valid_from)
            VALUES ('44444444-4444-4444-8444-444444444444','11111111-1111-4111-8111-111111111111','operator',clock_timestamp()),
                   ('55555555-5555-4555-8555-555555555555','22222222-2222-4222-8222-222222222222','operator',clock_timestamp());
          INSERT INTO education_v30.site_publication_bindings(site_id,public_slug,status,published_at)
            VALUES ('44444444-4444-4444-8444-444444444444','ci-v301-published','published',clock_timestamp()),
                   ('55555555-5555-4555-8555-555555555555','ci-v301-draft','draft',NULL);
          INSERT INTO education_v30.blueprint_reference_item_versions
            (item_id, version_no, title, summary, description, lifecycle)
          SELECT id, 2, 'Unpublished test version', 'Must remain private',
            'Draft reference content', 'draft'
          FROM education_v30.blueprint_reference_items
          WHERE code = 'can.club.chess';
          SQL
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v organization_id=11111111-1111-4111-8111-111111111111 \
            -v application_role=can_v30_ci_app \
            -v program_catalog_role=can_v30_program_catalog_11111111111141118111111111111111 \
            -f database/canonical/v3.0.1/provision-program-catalog-role.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v application_role=can_v30_ci_app \
            -f database/canonical/v3.0.1/provision-public-site-reader-role.sql
          # Separate test-only role: prove program-fit evaluations can reuse the
          # advisory availability calculation without catalog privileges.
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE can_v30_ci_fit NOLOGIN NOINHERIT NOBYPASSRLS;
          GRANT can_v30_ci_fit TO can_v30_ci_app WITH INHERIT FALSE, SET TRUE;
          GRANT USAGE ON SCHEMA education_v30 TO can_v30_ci_fit;
          GRANT EXECUTE ON FUNCTION education_v30.v28_role_has_purpose(text),
            education_v30.v30_catalog_program_availability(uuid,text) TO can_v30_ci_fit;
          INSERT INTO education_v30.database_role_organization_bindings (
            db_role, organization_id, purpose_code, valid_from, status
          ) VALUES (
            'can_v30_ci_fit', '11111111-1111-4111-8111-111111111111',
            'program_fit', clock_timestamp(), 'approved'
          );
          SQL
      - name: Verify login-role membership and tenant/public boundaries
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=ci_v301_disposable_only psql -h 127.0.0.1 -p 5432 -U can_v30_ci_app -d can_v301_ci -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          -- The application login itself must not inherit any domain table access.
          -- Explicit purpose role selection is mandatory for every query.
          DO $app_login_test$
          BEGIN
            IF has_table_privilege(current_user, 'education_v30.sites', 'SELECT')
               OR has_table_privilege(current_user, 'education_v30.blueprint_configurations', 'SELECT')
               OR has_table_privilege(current_user, 'education_v30.canonical_sessions', 'SELECT')
               OR has_table_privilege(current_user, 'education_v30.learner_course_attempts', 'SELECT')
               OR has_table_privilege(current_user, 'education_v30_secure.formative_practice_responses', 'SELECT')
            THEN
              RAISE EXCEPTION 'Restricted login inherited canonical table access';
            END IF;
            IF NOT pg_has_role(current_user,
                'can_v30_program_catalog_11111111111141118111111111111111', 'SET')
               OR NOT pg_has_role(current_user, 'can_v30_public_site_reader', 'SET')
            THEN
              RAISE EXCEPTION 'Restricted login lacks required purpose-role selection';
            END IF;
          END $app_login_test$;
          SET LOCAL ROLE can_v30_program_catalog_11111111111141118111111111111111;
          DO $role_test$
          BEGIN
            IF (SELECT count(*) FROM education_v30.sites) <> 1 THEN
              RAISE EXCEPTION 'Catalog can see other Organization Sites or cannot see own Site';
            END IF;
            IF (SELECT count(*) FROM education_v30.sites WHERE id = '55555555-5555-4555-8555-555555555555') <> 0 THEN
              RAISE EXCEPTION 'Cross-organization Site was visible';
            END IF;
            IF has_table_privilege(current_user, 'education_v30.sites', 'UPDATE') THEN
              RAISE EXCEPTION 'Catalog role unexpectedly has Site write access';
            END IF;
            IF (SELECT count(*) FROM education_v30.blueprint_reference_items) <> 74 THEN
              RAISE EXCEPTION 'Curated active Blueprint reference catalog must contain 74 items';
            END IF;
            IF (SELECT count(*) FROM education_v30.blueprint_reference_item_versions) <> 74 THEN
              RAISE EXCEPTION 'Draft Blueprint reference version was exposed or published catalog is incomplete';
            END IF;
            IF has_column_privilege(current_user,
                'education_v30.blueprint_reference_item_versions', 'metadata', 'SELECT') THEN
              RAISE EXCEPTION 'Restricted catalog reader can access private reference metadata';
            END IF;
            IF has_table_privilege(current_user, 'education_v30.blueprint_reference_items', 'INSERT') THEN
              RAISE EXCEPTION 'Blueprint reference library was writable by catalog role';
            END IF;
            IF NOT education_v30.v28_role_has_purpose('program_catalog') THEN
              RAISE EXCEPTION 'Catalog role binding is missing';
            END IF;
          END $role_test$;
          RESET ROLE;
          SET LOCAL ROLE can_v30_public_site_reader;
          DO $public_test$
          BEGIN
            IF (SELECT count(*) FROM education_v30.v301_public_site_claims('ci-v301-published')) <> 1 THEN
              RAISE EXCEPTION 'Published Site unavailable to public reader';
            END IF;
            IF (SELECT count(*) FROM education_v30.v301_public_site_claims('ci-v301-draft')) <> 0 THEN
              RAISE EXCEPTION 'Draft Site exposed to public reader';
            END IF;
            IF has_table_privilege(current_user, 'education_v30.site_publication_bindings', 'SELECT') THEN
              RAISE EXCEPTION 'Public reader can directly read publication bindings';
            END IF;
          END $public_test$;
          RESET ROLE;
          SET LOCAL ROLE can_v30_ci_fit;
          DO $fit_test$
          DECLARE available bigint;
          BEGIN
            IF NOT education_v30.v28_role_has_purpose('program_fit') THEN
              RAISE EXCEPTION 'Program-fit role binding is missing';
            END IF;
            SELECT count(*) INTO available
              FROM education_v30.v30_catalog_program_availability(
                '33333333-3333-4333-8333-333333333333', 'onsite'
              );
            IF available IS NULL THEN
              RAISE EXCEPTION 'Program-fit advisory availability did not execute';
            END IF;
            IF has_table_privilege(current_user,
                'education_v30.qualification_program_fit_assessments', 'SELECT') THEN
              RAISE EXCEPTION 'Program-fit test role can read raw assessments';
            END IF;
          END $fit_test$;
          ROLLBACK;
          SQL
      - name: Record database acceptance evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### Canonical v3.0.1 database acceptance"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Disposable PostgreSQL 18 service only; no Neon secrets"
            echo "- The rollback check is not a production migration or app-role deployment approval"
          } >> "$GITHUB_STEP_SUMMARY"

  blueprint-write-acceptance:
    name: Canonical Blueprint restricted-role write acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: can_v301_blueprint_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: can_v301_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d can_v301_blueprint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      NODE_ENV: test
      CAN_TEST_DB_WRITES_ENABLED: 'true'
      TEST_DATABASE_URL: postgresql://postgres:can_v301_ci_disposable@127.0.0.1:5432/can_v301_blueprint_ci
      CAN_CANONICAL_TEST_APP_DATABASE_URL: postgresql://can_v30_ci_blueprint_app:ci_v301_blueprint_disposable@127.0.0.1:5432/can_v301_blueprint_ci
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL command-line client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Install canonical schema and seed separate Organization fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/canonical/v3.0.1/schema.sql
          npm run db:seed:canonical:v301:demo
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v publisher_organization_id=11110000-0000-4000-8000-000000000003 \
            -f database/canonical/v3.0.1/seed-blueprint-starters.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE can_v30_ci_blueprint_app LOGIN NOINHERIT NOBYPASSRLS PASSWORD 'ci_v301_blueprint_disposable'"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v organization_id=11110000-0000-4000-8000-000000000001 \
            -v application_role=can_v30_ci_blueprint_app \
            -f database/canonical/v3.0.1/provision-blueprint-roles.sql
      - name: Verify restricted author and reviewer writes and rollback
        run: npm run db:test:canonical:v301:blueprint-flow
      - name: Record Blueprint acceptance evidence
        if: always()
        run: |
          {
            echo "### Canonical Blueprint restricted-role acceptance"
            echo "- Commit: $GITHUB_SHA"
            echo "- Disposable PostgreSQL 18; native Valor/Barton fixtures"
            echo "- Verifies draft, independent approval, planning Deployment, tenant isolation and rollback"
            echo "- No application/Neon production database writes"
          } >> "$GITHUB_STEP_SUMMARY"
