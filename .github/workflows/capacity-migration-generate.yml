name: Capacity Migration Generation

on:
  push:
    branches:
      - educational-capacity-model

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: capacity-drizzle-generated
          path: drizzle/
          retention-days: 1
