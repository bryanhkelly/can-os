name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "db/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate incremental migration generation
        run: |
          npm run db:generate
          echo "Drizzle migration generation succeeded from committed history."
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::Drizzle generated uncommitted migration changes. Commit generated SQL and snapshots before merging."
            git status --short -- drizzle/
            exit 1
          fi

      - name: Upload generated migration for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migration-review
          path: drizzle/
          retention-days: 7

      - name: Test
        run: npm test
