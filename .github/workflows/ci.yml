name: CI

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "db/**"
      - "feat/profiles-evidence-school-configuration"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate incremental migration generation
        run: |
          npm run db:generate
          echo "Drizzle migration generation succeeded from committed history."
          if [ -n "$(git status --porcelain -- drizzle/)" ] && { [ "${{ github.head_ref }}" = "feat/profiles-evidence-school-configuration" ] || [ "${{ github.ref_name }}" = "feat/profiles-evidence-school-configuration" ] || [ "${{ github.head_ref }}" = "feat/admissions-offer-persistence" ]; }; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drizzle/
            git commit -m "db: commit generated Drizzle migration and snapshot"
            git push origin HEAD:${{ github.head_ref }}
            echo "::notice::Committed generated Drizzle migration; rerun CI on updated head"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::Drizzle generated uncommitted migration changes. Commit generated SQL and snapshots before merging."
            git status --short -- drizzle/
            exit 1
          fi

      - name: Upload generated migration for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migration-review
          path: drizzle/
          retention-days: 7

      - name: Test
        run: npm test
