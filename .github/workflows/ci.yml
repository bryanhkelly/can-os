name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - FullFlow
      - integration/canonical-v301-pr279-281

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert exact CI commit
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo '::error::Checkout SHA differs from CI SHA'; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Validate reporting migrations before dependency installation
        run: npm run verify:reporting:sql

      - name: Validate committed Drizzle snapshot chain
        run: node scripts/check-drizzle-snapshot-chain.mjs

      - name: Check documentation references
        run: npm run docs:check

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and JavaScript test source imports
        run: npm run check:test-source-syntax

      # The hosted deployment uses a distinct Vite environment and import
      # protection graph. A generic build cannot certify Cloudflare readiness.
      - name: Build Cloudflare production target
        run: npm run build:cloudflare

      # TanStack generates src/routeTree.gen.ts during Vite build. Static route
      # contracts cannot run on a clean checkout before this build.
      - name: Build application and generate route graph
        run: npm run build

      - name: Audit route fixture coverage
        id: route_fixtures
        continue-on-error: true
        run: node scripts/check-route-fixture-coverage.mjs

      - name: Enforce shared mutation evidence writers
        run: node scripts/check-mutation-hygiene.mjs

      - name: Enforce shared capability boundaries
        run: node scripts/acceptance/check-shared-capability-boundaries.mjs

      - name: Check canonical route ownership contracts
        run: node scripts/check-platform-route-contracts.mjs --check

      - name: Admissions and authorization regressions
        run: npx vitest run tests/unit/admissions-session-roles.test.ts tests/unit/admissions-offer-events.test.ts tests/unit/admissions-seat-occupancy.test.ts

      - name: School safety and opening unit regressions
        run: npm run test:safety

      - name: Typecheck application and all tests
        run: npm run typecheck:full

      - name: Check named exports imported by tests
        run: npm run check:test-import-exports

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and design-system checks
        run: npm run lint

      - name: Exercise changed-line warning parser
        run: npm run test:lint-regressions

      - name: Fail on newly introduced ESLint warnings
        run: npm run check:lint-regressions

      - name: Test
        run: npm test

      - name: FullFlow migration artifact-stage checks
        run: node --test scripts/fullflow-post0051-artifacts.check.mjs

      - name: Validate migration integrity
        run: npx drizzle-kit check

      # Generated snapshots stop at 0086; 0087+ are reviewed SQL-only.
      # Running drizzle-kit generate on this baseline can output duplicate
      # migrations and does NOT establish model parity. Keep the existing
      # journal/SQL guards and test this explicit fail-closed policy.
      - name: Test governed SQL-only migration ledger and safety guards
        run: npm run test:migration-safety

      # Retain fixture coverage as a hard CI gate without hiding the results
      # of typecheck, lint or unit tests when route-fixture coverage fails.
      - name: Enforce route fixture audit after independent checks
        if: ${{ !cancelled() && steps.route_fixtures.outcome == 'failure' }}
        run: |
          echo "::error::Route fixture audit failed; inspect Audit route fixture coverage. Typecheck, lint and tests were allowed to run independently."
          exit 1

      - name: Upload generated migration for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migration-review
          path: drizzle/
          retention-days: 7
