name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "db/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate migration
        run: |
          rm -rf drizzle
          npm run db:generate
          echo "=== CAN_OS_GENERATED_MIGRATION ==="
          cat drizzle/*.sql
          echo "=== END_CAN_OS_GENERATED_MIGRATION ==="

      - name: Test
        run: npm test
