name: School Blueprint SQL Acceptance
on:
  pull_request:
    paths:
      - 'drizzle/0079_site_blueprint_foundation.sql'
      - 'drizzle/0080_school_blueprint_reference_library.sql'
      - 'src/db/schema/school-blueprint.ts'
      - 'tests/sql/school-blueprint/**'
      - '.github/workflows/school-blueprint-schema-validation.yml'
  workflow_dispatch:
jobs:
  schema-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: blueprint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: blueprint_ci
    steps:
      - uses: actions/checkout@v4
      - name: Establish canonical parent-table signatures on disposable Postgres
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/school-blueprint/parents.sql
      - name: Apply Site Blueprint foundation migration
        run: psql -v ON_ERROR_STOP=1 -f drizzle/0079_site_blueprint_foundation.sql
      - name: Apply reference library and verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f drizzle/0080_school_blueprint_reference_library.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/0080_school_blueprint_reference_library.sql
      - name: Verify constraints, scope isolation and seed counts
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/school-blueprint/acceptance.sql

  type-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check complete CAN OS schema
        run: npm run typecheck
      - name: Lint new Blueprint types and contracts
        run: npx eslint src/db/schema/school-blueprint.ts src/domain/school-blueprint.ts tests/unit/site-blueprint-foundation.test.ts
      - name: Run Blueprint domain contract unit tests
        run: npx vitest run tests/unit/site-blueprint-foundation.test.ts
